# Search space for ORB Bot x UK100 — DRAFT, NEEDS YOUR REVIEW.
#
# The bot exposes 87 parameters. Nine are searched here. That ratio is the whole
# point: every extra free dimension is another way to fit noise, and an
# exhaustive grid over 87 parameters would exceed 10^9 combinations.
#
# Choosing which nine carry the edge is a strategy judgement, not a coding one.
# Read the `notes` section at the bottom and tell me what you disagree with —
# these ranges encode my assumptions about your strategy, not your knowledge of it.

fixed:
  # ── TIMEZONE: the single most important setting in this file ──────────────
  # UK100-BUILD-PLAN.md is explicit: "UK100 session times are Europe/London
  # wall-clock ... never hardcode UTC." The bot defaults to UseFixedUtcTimes=true,
  # which would silently shift the opening range by an hour for the ~7 months a
  # year that BST is in effect. That would not fail loudly — it would just
  # backtest a different strategy than the one you trade.
  "Use Fixed UTC Times": false
  "Session Time Zone": EuropeLondon

  "Trading Start Time": "00:00:00"

  # ── Session housekeeping ─────────────────────────────────────────────────
  "Enable Kill Switch": false
  "Kill Switch Time": "23:59:00"
  "Enable Close Positions Time": true
  # Index CFD: do not carry an intraday breakout overnight through the close.
  "Close Positions Time": "16:25:00"

  # ── ORB mechanics: operational, not strategic ────────────────────────────
  "ORB Bars TimeFrame": Minute
  "Max ORB Range Pips": 200
  "Min ORB Range Pips": 0.0
  "Point Unit Mode": UsePipSizeAsPoint
  "Enable ORB Backfill": true
  "Enable ORB Self-Heal": true
  "ORB Self-Heal Interval Seconds": 30
  "Enable Post-Lock Confirm Replay": true
  "Post-Lock Replay Confirm Bars": 1
  "Post-Lock Replay Max Delay Minutes": 20

  # ── Catch-up entry: off. A separate hypothesis, tested separately ────────
  "Enable Catch-Up Entry": false
  "Catch-Up Requires Confirmation Bars": true
  "Catch-Up Max Distance Beyond Threshold Pips": 0.0

  # ── Breakout mechanics not under test here ───────────────────────────────
  "Confirmation Bars Count": 1
  "Breakout Evaluation Moment": ClosedBarsOnly
  "Candle Direction Requirement": NoPreference
  "Allow Long": true
  "Allow Short": true

  # ── Trend filter details (the on/off switch and EMA period ARE searched) ──
  "Trend TimeFrame": Minute15
  "Trend Slope Lookback Bars": 3
  "Trend Min Slope Pips": 0.0
  "Neutral Min Slope Pips": 0.0
  "Trend Neutral Policy": BlockAll
  "Trend Filter Verbose Logs": false

  # ── DAY FILTERS: NEVER OPTIMISED ─────────────────────────────────────────
  # Seven free bits that can only remove losing days in hindsight
  # (01-Research 4.1). Reported as a per-day diagnostic with confidence
  # intervals instead, and only acted on with an economic rationale you sign off.
  "Trade Monday": true
  "Trade Tuesday": true
  "Trade Wednesday": true
  "Trade Thursday": true
  "Trade Friday": true
  "Trade Saturday": false
  "Trade Sunday": false

  "Re-Entry Mode": AfterStopLossOnly
  "Max Trades Per Day": 1
  # Stop management moves wholly to orb_uk100_exits, where its trigger and step
  # are tuned properly. Probing it here at default settings would have cost a
  # dimension to answer a question the exits study answers better.
  "Enable Dynamic Stop": false
  # CloseBeyond is the conservative definition. BodyCross/WickBeyond are tested
  # in orb_uk100_exits once entry geometry is settled — WickBeyond in particular
  # tends to flatter in-sample and needs the walk-forward to judge it.
  "Breakout Cross Type": CloseBeyond
  # Even split; the exact split is tuned in the exits study.
  "TP1 Close Percent": 50
  "TP2 Close Percent": 50
  # Defaults for the dynamic-stop probe; tuned in the exits study.
  "Break Even Trigger R": 1.0
  "Dynamic Step R": 0.25

  # ── Multi-TP: TP1/TP2 are searched. TP3/TP4 stay off ─────────────────────
  # A four-rung ladder on an intraday index trade that closes at 16:25 is more
  # rungs than the move usually supports, and each rung is two more dimensions.
  # TP2 Close Percent is not searched: it is pinned to the remainder of TP1 so
  # the ladder always closes 100%, which removes a dimension AND removes the
  # possibility of a trial leaving a silent unclosed residue.
  "TP3 R": 0.0
  "TP3 Close Percent": 0
  "TP4 R": 0.0
  "TP4 Close Percent": 0

  # ── Early risk reduction: off. Overlaps break-even; testing both at once
  #     makes neither attributable ────────────────────────────────────────
  "Enable Early Risk Reduction": false
  "Early Risk Reduction Trigger R": 0.5
  "Early Risk Reduction Remaining Risk %": 50.0
  "Break Even Extra Pips": 0.0

  # ── Risk: policy, fixed so R-multiples compare across trials ─────────────
  "Risk Amount": 100
  "Risk Currency": AccountCurrency
  "Enable Execution Risk Cap": true
  "Assumed Stop Slippage Pips": 80.0
  "Max Loss Per Trade (Account CCY)": 200.0

  # ── Safety rails: never searched ─────────────────────────────────────────
  "Min Risk Pips": 2.0
  "Max Volume In Units": 0
  "Max Spread Pips": 0
  "Max Distance Beyond Threshold Pips": 0
  "Require Entry Beyond Threshold": true
  "Enable Margin Safety": true
  "Max Margin Usage %": 50.0
  "Clamp Volume To Margin": true
  "Enable Protection Fallback": true
  "Fallback SL Pips": 20.0

  # ── Diagnostics: off for speed across ~1,600 runs ────────────────────────
  "Bot Label Prefix": "ORB"
  "Enable Debug Logging": false
  "Verbose Logging": false
  "Explain Blocked Entries": false
  "Explain Near-Miss Breakouts": false
  "Draw ORB Lines": false
  "Draw Threshold Lines": false

search:
  # ── The session anchor: WHEN the opening range forms ─────────────────────
  # Searched as an anchor plus a duration rather than two absolute times, so
  # every sampled point is coherent by construction. Range End Time is derived
  # (see the `derived:` block) — it is never sampled directly.
  "Range Start Time":
    {type: cat, choices: ["08:00:00", "09:00:00", "14:30:00"]}
  "_Range Minutes":
    {type: cat, choices: [15, 30, 60]}

  # ── Entry (always active) ────────────────────────────────────────────────
  "Entry Offset Pips":
    {type: float, low: 0.0, high: 15.0, step: 2.5}
  "Stop Loss ORB Percent":
    {type: float, low: 25.0, high: 100.0, step: 12.5}
  "Confirmation TimeFrame":
    {type: cat, choices: [Minute, Minute5, Minute15]}
  # ── Trend filter (2 dims when on, 1 when off) ────────────────────────────
  "Enable Trend Filter":
    {type: bool}
  "Trend EMA Period":
    {type: int, low: 5, high: 50, step: 5, condition: "Enable Trend Filter"}

  # ── Exit management: three mutually-exclusive regimes ────────────────────
  # Declared as branches so they never compound. A trial explores exactly one,
  # which is also how the strategy actually behaves — you do not run a fixed
  # target and a trailing stop simultaneously.
  "Enable Multi TP":
    {type: bool}

  # Single-target regime
  "Take Profit R":
    {type: float, low: 1.0, high: 4.0, step: 0.5, condition: "Enable Multi TP == false"}

  # Laddered regime
  "TP1 R":
    {type: float, low: 0.5, high: 2.0, step: 0.25, condition: "Enable Multi TP == true"}
  "TP2 R":
    {type: float, low: 1.5, high: 5.0, step: 0.5, condition: "Enable Multi TP == true"}

derived:
  # Range End Time is computed, never sampled. This is what makes searching the
  # anchor safe: a 14:30 start can only ever pair with a 14:45/15:00/15:30 end.
  "Range End Time":
    from: "Range Start Time"
    add_minutes: "_Range Minutes"

constraints:
  # TP2 must sit beyond TP1 or the ladder is incoherent.
  - "TP2 R > TP1 R"

notes: |
  Range Start Time — the session anchor: what event the opening range is
    measured from. 08:00 is the FTSE cash open and is what you trade today.
    09:00 tests whether letting the first hour's noise clear produces a cleaner
    range. 14:30 is the US cash open, which drives a large share of FTSE
    afternoon movement and is a genuinely different strategy wearing the same
    mechanics. If 08:00 wins on a plateau, that is real evidence for your
    current approach rather than an assumption behind it.
  _Range Minutes — how long the range forms for: 15, 30 or 60 minutes. The
    leading underscore marks it engine-local; it is never sent to the bot.
    Range End Time is derived from anchor + duration, which is what keeps the
    pairing coherent — searching two absolute times independently would allow a
    14:30 start with an 08:15 end, and most of the sampled space would be
    invalid.
  Entry Offset Pips — how far beyond the range boundary price must travel
    before entry. This is the core false-breakout filter. 0 means "trade the
    touch"; above ~15 pips on the FTSE you are chasing a move that has already
    happened.
  Stop Loss ORB Percent — stop placement as a fraction of the range. Below 25%
    the stop sits inside normal post-open noise; above 100% the stop is wider
    than the range that defined the trade, which makes the R-multiple
    meaningless.
  Take Profit R — the reward target. Below 1.0 no breakout strategy survives
    its own win rate; above 4.0 an intraday index move rarely reaches target
    before the 16:25 close.
  Confirmation TimeFrame — how much confirmation a breakout needs. This trades
    off false breakouts against entry lag and is, with Entry Offset, the most
    likely place for a genuine edge to live.
  Breakout Cross Type — what counts as "beyond": a close, a body, or a wick.
    Three genuinely different definitions of the same event. Expect WickBeyond
    to look best in-sample and degrade out-of-sample; if it survives walk-forward
    that is interesting.
  Enable Trend Filter — the central structural question: is this a
    trade-every-breakout system or a trade-with-the-trend system? Worth a
    dimension on its own.
  Trend EMA Period — only meaningful when the filter is on. 5-50 on M15 spans
    "very fast" to "half-session". Step 5 keeps the grid honest; finer
    resolution here would be fitting noise.
  Max Trades Per Day — 1 (the disciplined single shot) versus 2 (allowing one
    re-entry after a stop). This is as much a risk policy as an edge parameter;
    watch whether 2 wins only by adding variance.

  Enable Multi TP — the exit *structure*: one fixed target, or a ladder that
    banks part of the position early. This changes the shape of the return
    distribution more than any single numeric parameter, so it is searched as a
    branch rather than assumed.
  Take Profit R — active only in the single-target regime. Below 1.0 no
    breakout survives its own win rate; above 4.0 an intraday index move rarely
    reaches target before the 16:25 close.
  TP1 R / TP1 Close Percent / TP2 R — the ladder. TP1 low enough to bank
    something on an average session, TP2 far enough to pay for the runners.
    TP2 Close Percent is pinned to the remainder rather than searched, so the
    position always closes fully and one dimension is saved.
  DIMENSION BUDGET: 11 parameters are declared, but a single trial explores at
  most 10, because the two target regimes are mutually exclusive. The engine
  enforces the limit on simultaneously-active dimensions, which is the number
  that matters statistically — a trial cannot overfit a parameter that was not
  in play.

  DEFERRED TO orb_uk100_exits (searched there, not left at defaults):
    Enable Dynamic Stop, Break Even Trigger R, Dynamic Step R — stop management
      is tuned properly with entry frozen, rather than probed at default
      settings here for the price of a dimension.
    Breakout Cross Type, Max Trades Per Day, Re-Entry Mode, TP1 Close Percent.
    TP3/TP4 — a four-rung ladder on a trade that closes at 16:25 is more rungs
      than the move supports, at two dimensions each.
    Early Risk Reduction — overlaps break-even so directly that testing both at
      once makes neither attributable. Its own study if break-even wins.
