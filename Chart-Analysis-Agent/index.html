/* ── System prompt (Part 16) ─────────────────────────────────────── */
const SYSTEM_PROMPT = `[ IDENTITY ]
You are an expert chart analyst with doctorate-level mastery of Smart Money Concepts (SMC) and ICT (Inner Circle Trader) methodology developed by Michael J. Huddleston. You have 25 years of institutional trading experience and analyse every chart with the precision of a professional prop trader.

[ CORE AXIOMS — NEVER VIOLATE THESE ]
1. Price is delivered algorithmically by the IPDA to seek liquidity concentrations.
2. Every significant move is preceded by a manipulation phase (liquidity sweep) and followed by distribution in the true direction.
3. Time matters as much as price. Kill zone context is mandatory in every analysis.
4. Never buy at premium. Never sell at discount. Identify equilibrium and trade accordingly.
5. A structural break is ambiguous until retested and rejected. Never confirm regime change on a break alone.
6. Protected highs and protected lows define the current regime until proven otherwise through the 3-phase regime change test: Break → Retest → Rejection.

[ ANALYSIS PROTOCOL — EXECUTE IN THIS ORDER ]
When given a chart screenshot, execute the following analysis sequence without exception:

■ STEP 1 — STRUCTURAL READING
  - Identify all visible swing highs and lows (STH, STL, ITH, ITL)

  - Identify the most recent PROTECTED HIGH and PROTECTED LOW
  - Note whether any protected levels have been broken and if so, whether they have been retested/rejected
  - Identify any BOS (continuation) or CHoCH (potential reversal) events visible

■ STEP 2 — LIQUIDITY MAPPING
  - Mark all visible Buy-Side Liquidity (BSL): equal highs, prior swing highs, obvious resistance clusters
  - Mark all visible Sell-Side Liquidity (SSL): equal lows, prior swing lows, obvious support clusters

■ STEP 3 — PD ARRAY IDENTIFICATION

  - Identify all Fair Value Gaps (three-candle imbalances)
  - Note any Breaker Blocks (failed OBs that have flipped)
  - Identify any Mitigation Blocks (unmitigated swing points)

  - Note the Consequent Encroachment (CE/midpoint) of each significant FVG

■ STEP 4 — PREMIUM/DISCOUNT ANALYSIS
  - Calculate the equilibrium (50% level) of the most recent significant dealing range

■ STEP 5 — TIME CONTEXT
  - Assess which kill zone the current candle formation represents (if visible from price context)
  - Note if a Judas Swing pattern is identifiable
  - Identify any AMD (Accumulation-Manipulation-Distribution) phases visible

■ STEP 6 — MULTI-TIMEFRAME CONTEXT

  - Identify the likely higher timeframe draw on liquidity even if not directly visible

[ OUTPUT FORMAT — MANDATORY STRUCTURE ]

SMC/ICT CHART ANALYSIS

REGIME ASSESSMENT

Bearish FVGs: [List with zones and CE levels]

Secondary Scenario Probability: [XX%] — [opposite direction]

MARKET NARRATIVE
[3–5 sentence plain-English summary of what smart money appears to be doing on this chart, where price is most likely to go next and why, and what the retail trap risk is.]

[ PROBABILITY SCORING RULES ]
Apply these rules when assigning probability scores:
BASE PROBABILITY STARTS AT 50% FOR ALL SCENARIOS.

ADD TO PROBABILITY (+) for:
+15% HTF (4H/Daily) structure aligns with the trade direction
+10% Trade is in correct premium/discount zone (long in discount, short in premium)
+10% Active kill zone (London Open, NY AM, Silver Bullet window)
+8% Confirmed liquidity sweep immediately preceding the setup

-20% Trading against a confirmed (3-phase) regime change
-15% Entry at or above equilibrium (for longs) or at or below equilibrium (for shorts)

- Never ignore the protected high/low framework
- Never confirm a regime change from a break alone — require the retest + rejection

- Never omit the invalidation level

/* ── Kill zones / macros ─────────────────────────────────────────── */
const KZS = [
  { name:'Asian Session',    start:[20,0], end:[0,0],  color:'#8B949E', wrap:true },
  { name:'London Open',      start:[2,0],  end:[5,0],  color:'#F0B429' },
  { name:'NY AM Kill Zone',  start:[7,0],  end:[10,0], color:'#22c55e' },
  { name:'NY Lunch (Avoid)', start:[11,30],end:[13,0], color:'#ef4444' },
  { name:'NY Close',         start:[13,30],end:[16,0], color:'#818cf8' },
];
const MACROS = [
  { name:'Macro 1 (Opening)',  start:[8,50],  end:[9,10]  },
  { name:'Macro 2',            start:[9,50],  end:[10,10] },
  { name:'London Close Macro', start:[10,50], end:[11,10] },
  { name:'PM Macro 1',         start:[13,10], end:[13,30] },
  { name:'PM Macro 2',         start:[14,50], end:[15,10] },
  { name:'PM Macro 3 (Close)', start:[15,50], end:[16,10] },
];

function inRange(h,m,[sh,sm],[eh,em],wrap=false){
  const now=h*60+m, s=sh*60+sm, e=eh*60+em;
  return wrap ? (now>=s||now<e) : (now>=s&&now<e);
}

/* ── Parsing helpers ─────────────────────────────────────────────── */
function parseAnalysis(text){
  if(!text) return {};
  const SECS=['REGIME ASSESSMENT','STRUCTURE','LIQUIDITY MAP','KEY PD ARRAYS',
    'PROBABILITY ASSESSMENT','TRADE IDEA 1 — PRIMARY','TRADE IDEA 2 — ALTERNATIVE',
    'KEY LEVELS TO WATCH','MARKET NARRATIVE'];
  const out={}; let cur=null;
  for(const raw of text.split('\n')){
    const line=raw.trim();
    const hit=SECS.find(s=>line===s||line.startsWith(s+' ('));
    if(hit){cur=hit;out[cur]=[];}
    else if(cur&&line) out[cur].push(line);
  }
  return out;
}
function gf(lines=[],key){
  for(const l of lines) if(l.startsWith(key+':')) return l.slice(key.length+1).trim();
  return null;
}
function pct(str){ const m=str?.match(/(\d+)\s*%/); return m?parseInt(m[1]):0; }
function dc(str){
  if(!str) return C.text;
  const u=str.toUpperCase();
  if(u.includes('BULL')||u.includes('LONG')||u.includes('INTACT')) return C.bull;
  if(u.includes('BEAR')||u.includes('SHORT')||u.includes('CHANGED')) return C.bear;
  return C.text;
}

/* ── Primitives ──────────────────────────────────────────────────── */
function s(obj){ return Object.fromEntries(Object.entries(obj)); }

function Card({title,color=C.gold,children}){
  return html`<div style=${{background:C.surface,border:`1px solid ${C.border}`,borderRadius:12,overflow:'hidden',marginBottom:10}}>

    </div>
    <div style=${{padding:'13px 15px'}}>${children}</div>
  </div>`;
}

function Row({label,value,vc}){
  if(!value) return null;
  const col=vc||dc(value);
  return html`<div style=${{display:'flex',gap:8,marginBottom:7,flexWrap:'wrap'}}>
    <span style=${{color:C.subtle,fontSize:11,minWidth:155,flexShrink:0}}>${label}</span>
    <span style=${{color:col,fontSize:12,flex:1,lineHeight:1.4}}>${value}</span>
  </div>`;
}

function ProbBar({label,p,dir}){
  const v=Math.max(0,Math.min(100,p));
  const col=v>=70?C.bull:v>=50?C.gold:C.bear;
  const dCol=dir?dc(dir):col;
  return html`<div style=${{marginBottom:10}}>
    <div style=${{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:4}}>
      <span style=${{fontSize:11,color:C.subtle}}>${label}</span>
      <div style=${{display:'flex',gap:8,alignItems:'center'}}>
        ${dir&&html`<span style=${{fontSize:11,fontWeight:700,color:dCol}}>${dir}</span>`}
        <span style=${{fontSize:13,fontWeight:700,color:col}}>${v}%</span>
      </div>
    </div>
    <div style=${{height:6,background:C.bg,borderRadius:3,overflow:'hidden'}}>
      <div class="bar" style=${{height:'100%',width:v+'%',background:col,borderRadius:3}}></div>
    </div>
  </div>`;
}

/* ── Session Clock ───────────────────────────────────────────────── */
function SessionClock(){
  const [now,setNow]=useState(()=>new Date());
  useEffect(()=>{const t=setInterval(()=>setNow(new Date()),1000);return()=>clearInterval(t);},[]);
  const ny=new Date(now.toLocaleString('en-US',{timeZone:'America/New_York'}));
  const lo=new Date(now.toLocaleString('en-US',{timeZone:'Europe/London'}));
  const tk=new Date(now.toLocaleString('en-US',{timeZone:'Asia/Tokyo'}));
  const h=ny.getHours(),m=ny.getMinutes();
  const activeKZ=KZS.find(k=>inRange(h,m,k.start,k.end,k.wrap));
  const activeMacro=MACROS.find(mk=>inRange(h,m,mk.start,mk.end));
  const fmt=d=>d.toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false});
  const fmtD=d=>d.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'});

  return html`<div>
    <${Card} title="World Clocks">
      <div style=${{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:10}}>
        ${[['New York',ny],['London',lo],['Tokyo',tk]].map(([lbl,t])=>html`
          <div key=${lbl} style=${{textAlign:'center'}}>
            <div style=${{fontSize:10,color:C.subtle,marginBottom:2}}>${lbl}</div>
            <div style=${{fontFamily:'monospace',fontSize:13,fontWeight:700,color:C.text}}>${fmt(t)}</div>
            <div style=${{fontSize:10,color:C.subtle}}>${fmtD(t)}</div>
          </div>`)}
      </div>
    <//>
    <${Card} title="Kill Zone Status">
      <div style=${{marginBottom:10}}>
        ${activeKZ
          ? html`<div style=${{padding:'9px 13px',borderRadius:8,border:`1px solid ${activeKZ.color}50`,background:activeKZ.color+'16',color:activeKZ.color,fontWeight:700,fontSize:13}}>🟢 ${activeKZ.name} — ACTIVE</div>`
          : html`<div style=${{padding:'9px 13px',borderRadius:8,border:`1px solid ${C.border}`,color:C.subtle,fontSize:12}}>⚫ No Kill Zone Active — Lower Probability</div>`}
        ${activeMacro&&html`<div style=${{marginTop:7,padding:'7px 13px',borderRadius:8,border:`1px solid ${C.gold}50`,background:C.gold+'12',color:C.gold,fontSize:12,fontWeight:600}}>⚡ ${activeMacro.name} Macro Window Active</div>`}
      </div>
      <div style=${{display:'grid',gridTemplateColumns:'1fr 1fr',gap:5}}>
        ${KZS.map(k=>{const a=inRange(h,m,k.start,k.end,k.wrap);return html`
          <div key=${k.name} style=${{display:'flex',alignItems:'center',gap:6,opacity:a?1:0.35,fontSize:11,color:k.color}}>
            <div class=${a?'pulse':''} style=${{width:6,height:6,borderRadius:'50%',background:k.color,flexShrink:0}}></div>
            ${k.name}
          </div>`})}
      </div>
    <//>
    <${Card} title="ICT Macro Windows (NY Time)">
      ${MACROS.map(mk=>{
        const a=inRange(h,m,mk.start,mk.end);
        const [sh,sm]=mk.start,[eh,em]=mk.end;
        const range=`${String(sh).padStart(2,'0')}:${String(sm).padStart(2,'0')}–${String(eh).padStart(2,'0')}:${String(em).padStart(2,'0')}`;
        return html`<div key=${mk.name} style=${{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'5px 9px',borderRadius:6,background:a?C.gold+'14':'transparent',border:`1px solid ${a?C.gold+'40':'transparent'}`,marginBottom:4,opacity:a?1:0.45}}>
          <span style=${{fontSize:11,color:a?C.gold:C.subtle,fontWeight:a?700:400}}>${mk.name}</span>
          <span style=${{fontSize:11,color:C.subtle,fontFamily:'monospace'}}>${range}</span>
        </div>`;
      })}
    <//>
  </div>`;
}

/* ── Level Calculator ────────────────────────────────────────────── */
function Calculator(){
  const [acc,setAcc]=useState('');
  const [risk,setRisk]=useState('1');
  const [entry,setEntry]=useState('');
  const [sl,setSl]=useState('');
  const [tp1,setTp1]=useState('');
  const [tp2,setTp2]=useState('');
  const [res,setRes]=useState(null);

  const inp={background:C.bg,border:`1px solid ${C.border}`,color:C.text,borderRadius:8,padding:'8px 11px',width:'100%',fontSize:13};

  const calc=()=>{
    const a=parseFloat(acc),r=parseFloat(risk)/100,e=parseFloat(entry),s=parseFloat(sl);
    if(!a||!r||!e||!s) return;
    const rAmt=a*r, dist=Math.abs(e-s), size=dist>0?rAmt/dist:0;
    const t1=parseFloat(tp1),t2=parseFloat(tp2);
    setRes({rAmt:rAmt.toFixed(2),dist:dist.toFixed(5),size:size.toFixed(4),
      rr1:tp1?(Math.abs(t1-e)/dist).toFixed(2):null,
      rr2:tp2?(Math.abs(t2-e)/dist).toFixed(2):null});
  };

  const Box=({label,val,col})=>html`<div style=${{textAlign:'center',padding:'9px 6px',borderRadius:8,background:col+'10',border:`1px solid ${col}30`}}>
    <div style=${{fontSize:10,color:C.subtle,marginBottom:2}}>${label}</div>
    <div style=${{fontSize:15,fontWeight:700,color:col}}>${val}</div>
  </div>`;

  return html`<div>
    <${Card} title="Position Size Calculator">
      <div style=${{display:'grid',gridTemplateColumns:'1fr 1fr',gap:9,marginBottom:11}}>
        ${[['Account ($)',acc,setAcc,'10000','1'],['Risk %',risk,setRisk,'1','0.1'],
           ['Entry Price',entry,setEntry,'1.08500','0.00001'],['Stop Loss',sl,setSl,'1.08350','0.00001'],
           ['Target 1',tp1,setTp1,'1.08800','0.00001'],['Target 2',tp2,setTp2,'1.09200','0.00001']
          ].map(([lbl,v,set,ph,step])=>html`
          <div key=${lbl}>
            <div style=${{fontSize:10,color:C.subtle,marginBottom:3,textTransform:'uppercase'}}>${lbl}</div>
            <input style=${inp} type="number" placeholder=${ph} step=${step} value=${v} onInput=${e=>set(e.target.value)} />
          </div>`)}
      </div>
      <button onClick=${calc} style=${{width:'100%',padding:'10px',background:C.gold,color:C.bg,border:'none',borderRadius:8,fontWeight:700,fontSize:13,cursor:'pointer'}}>
        Calculate Position
      </button>
      ${res&&html`<div style=${{marginTop:12}}>
        <div style=${{display:'grid',gridTemplateColumns:'1fr 1fr',gap:7,marginBottom:7}}>
          <${Box} label="Risk Amount" val=${'$'+res.rAmt} col=${C.bear} />
          <${Box} label="Stop Distance" val=${res.dist} col=${C.subtle} />
          <${Box} label="Position Size" val=${res.size} col=${C.gold} />
          ${res.rr1&&html`<${Box} label="R:R to T1" val=${res.rr1+':1'} col=${parseFloat(res.rr1)>=3?C.bull:C.gold} />`}
        </div>
        ${res.rr2&&html`<${Box} label="R:R to T2" val=${res.rr2+':1'} col=${parseFloat(res.rr2)>=3?C.bull:C.gold} />`}
        ${res.rr1&&parseFloat(res.rr1)<3&&html`
          <div style=${{marginTop:8,padding:'8px 11px',borderRadius:7,background:C.bear+'12',border:`1px solid ${C.bear}30`,fontSize:11,color:C.bear}}>
            ⚠ R:R below ICT minimum of 3:1 — consider adjusting targets.
          </div>`}
      </div>`}
    <//>
    <${Card} title="ICT Risk Rules" color=${C.subtle}>
      ${[['Max risk per trade','1% of account (0.5% conservative)'],
         ['Minimum R:R','3:1 — do not trade below this'],
         ['Max daily loss','3% — stop after 3 consecutive losses'],
         ['Partial profit','50% at T1, move stop to break-even'],
        ].map(([r,v])=>html`
        <div key=${r} style=${{display:'flex',justifyContent:'space-between',marginBottom:7,gap:8}}>
          <span style=${{fontSize:11,color:C.subtle}}>${r}</span>
          <span style=${{fontSize:11,color:C.text,textAlign:'right'}}>${v}</span>
        </div>`)}
    <//>
  </div>`;
}

/* ── Image compression helper ────────────────────────────────────── */
function compressImage(file){
  return new Promise(resolve=>{
    const r=new FileReader();
    r.onload=e=>{
      const img=new Image();
      img.onload=()=>{
        const MAX=1600;
        const scale=Math.min(1,MAX/Math.max(img.width,img.height));
        const w=Math.round(img.width*scale), h=Math.round(img.height*scale);
        const canvas=document.createElement('canvas');
        canvas.width=w; canvas.height=h;
        const ctx=canvas.getContext('2d');
        ctx.drawImage(img,0,0,w,h);
        const dataUrl=canvas.toDataURL('image/jpeg',0.92);
        resolve({base64:dataUrl.split(',')[1],mediaType:'image/jpeg',preview:dataUrl});
      };
      img.src=e.target.result;
    };
    r.readAsDataURL(file);
  });
}

/* ── Image Uploader ──────────────────────────────────────────────── */
function Uploader({onLoad}){
  const [drag,setDrag]=useState(false);
  const ref=useRef(null);
  const process=useCallback(async file=>{
    if(!file||!file.type.match(/image\/(jpeg|png|webp)/)) return;
    const data=await compressImage(file);
    onLoad(data);
  },[onLoad]);

  return html`<div
    onClick=${()=>ref.current?.click()}
    onDrop=${e=>{e.preventDefault();setDrag(false);process(e.dataTransfer.files[0]);}}
    onDragOver=${e=>{e.preventDefault();setDrag(true);}}
    onDragLeave=${()=>setDrag(false)}
    style=${{border:`2px dashed ${drag?C.gold:C.border}`,borderRadius:12,padding:'50px 20px',textAlign:'center',cursor:'pointer',transition:'all .2s',background:drag?C.gold+'07':'transparent'}}>
    <input ref=${ref} type="file" accept="image/jpeg,image/png,image/webp" style=${{display:'none'}} onChange=${e=>process(e.target.files[0])} />
    <div style=${{fontSize:44,marginBottom:10}}>📊</div>
    <div style=${{color:C.text,fontWeight:600,fontSize:15,marginBottom:5}}>Drop chart screenshot here</div>
    <div style=${{color:C.subtle,fontSize:12}}>or tap to browse — PNG · JPEG · WEBP</div>
    <div style=${{color:C.border,fontSize:11,marginTop:8}}>TradingView · MT4/5 · cTrader screenshots supported</div>
  </div>`;
}

/* ── Trade Card ──────────────────────────────────────────────────── */
function TradeCard({title,lines,primary}){
  const g=k=>gf(lines,k);
  const dir=g('Direction'),setup=g('Setup Type'),ez=g('Entry Zone'),sl=g('Stop Loss');
  const t1=g('Target 1'),t2=g('Target 2'),t3=g('Target 3');
  const rr=g('Estimated R:R'),trigger=g('Entry Trigger Required'),prob=g('Probability');
  const isLong=dir?.includes('LONG');
  const dCol=isLong?C.bull:C.bear;
  const p=pct(prob);

  return html`<div style=${{background:C.surface,border:`1px solid ${primary?C.gold:C.border}`,borderRadius:12,overflow:'hidden',marginBottom:10}}>
    <div style=${{padding:'11px 15px',borderBottom:`1px solid ${C.border}`,background:primary?C.gold+'10':C.border+'15',display:'flex',justifyContent:'space-between',alignItems:'flex-start'}}>
      <div>
        <div style=${{color:primary?C.gold:C.subtle,fontWeight:700,fontSize:12,textTransform:'uppercase',letterSpacing:'0.06em'}}>${title}</div>
        ${setup&&html`<div style=${{color:C.subtle,fontSize:11,marginTop:2}}>${setup}</div>`}
      </div>
      <div style=${{display:'flex',gap:6,alignItems:'center'}}>
        ${dir&&html`<span style=${{color:dCol,background:dCol+'20',border:`1px solid ${dCol}40`,padding:'2px 8px',borderRadius:4,fontWeight:700,fontSize:12}}>${dir}</span>`}
        ${primary&&html`<span style=${{color:C.gold,background:C.gold+'20',padding:'2px 8px',borderRadius:4,fontSize:11,fontWeight:600}}>PRIMARY</span>`}
      </div>
    </div>
    <div style=${{padding:'13px 15px'}}>
      <div style=${{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:7,marginBottom:10}}>
        ${[[ez,'Entry',C.gold],[sl,'Stop Loss',C.bear],[t1,'Target 1',C.bull]].map(([v,lbl,col])=>v&&html`
          <div key=${lbl} style=${{textAlign:'center',padding:'9px 5px',borderRadius:8,background:col+'10',border:`1px solid ${col}30`}}>
            <div style=${{fontSize:10,color:col+'bb',marginBottom:2}}>${lbl}</div>
            <div style=${{fontSize:12,fontWeight:700,color:col}}>${v}</div>
          </div>`)}
      </div>
      ${(t2||t3)&&html`<div style=${{display:'grid',gridTemplateColumns:t2&&t3?'1fr 1fr':'1fr',gap:7,marginBottom:10}}>
        ${[t2&&['T2',t2],t3&&['T3',t3]].filter(Boolean).map(([lbl,v])=>html`
          <div key=${lbl} style=${{textAlign:'center',padding:'7px',borderRadius:8,background:C.bull+'07',border:`1px solid ${C.bull}25`}}>
            <div style=${{fontSize:10,color:C.bull+'99',marginBottom:2}}>${lbl}</div>
            <div style=${{fontSize:12,fontWeight:700,color:C.bull}}>${v}</div>
          </div>`)}
      </div>`}
      ${rr&&html`<div style=${{display:'flex',justifyContent:'space-between',marginBottom:8}}>
        <span style=${{fontSize:11,color:C.subtle}}>Estimated R:R</span>
        <span style=${{fontSize:13,fontWeight:700,color:C.gold}}>${rr}</span>
      </div>`}
      ${p>0&&html`<${ProbBar} label="Setup Probability" p=${p} />`}
      ${trigger&&html`<div style=${{marginTop:9,padding:'9px 11px',background:C.bg,borderRadius:8,border:`1px solid ${C.border}`}}>
        <div style=${{fontSize:10,color:C.subtle,marginBottom:3,textTransform:'uppercase',letterSpacing:'0.05em'}}>Entry Trigger Required</div>
        <div style=${{fontSize:12,color:C.text,lineHeight:1.5}}>${trigger}</div>
      </div>`}
    </div>
  </div>`;
}

/* ── Analysis Display ────────────────────────────────────────────── */
function AnalysisDisplay({raw}){
  const sec=useMemo(()=>parseAnalysis(raw),[raw]);
  const regime=sec['REGIME ASSESSMENT']||[];
  const struct=sec['STRUCTURE']||[];
  const liq=sec['LIQUIDITY MAP']||[];
  const pda=sec['KEY PD ARRAYS']||[];
  const prob=sec['PROBABILITY ASSESSMENT']||[];
  const t1=sec['TRADE IDEA 1 — PRIMARY']||[];
  const t2=sec['TRADE IDEA 2 — ALTERNATIVE']||[];
  const lvl=sec['KEY LEVELS TO WATCH']||[];
  const narr=sec['MARKET NARRATIVE']||[];

  const pStr=gf(prob,'Primary Scenario Probability')||'';
  const sStr=gf(prob,'Secondary Scenario Probability')||'';
  const conf=gf(prob,'Confidence Level');
  const confCol=conf==='HIGH'?C.bull:conf==='MEDIUM'?C.gold:C.bear;

  return html`<div>
    <div style=${{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'12px 15px',background:C.surface,border:`1px solid ${C.gold}40`,borderRadius:12,marginBottom:10}}>
      <div>
        <div style=${{color:C.gold,fontWeight:700,fontSize:15}}>SMC/ICT Chart Analysis</div>
        <div style=${{color:C.subtle,fontSize:10,marginTop:1}}>claude-sonnet-4-6 · ICT/SMC Framework v1.0</div>
      </div>
      ${conf&&html`<div style=${{textAlign:'center'}}>
        <div style=${{fontSize:10,color:C.subtle,marginBottom:1}}>CONFIDENCE</div>
        <div style=${{fontSize:17,fontWeight:800,color:confCol}}>${conf}</div>
      </div>`}
    </div>

    ${(pct(pStr)>0||pct(sStr)>0)&&html`<${Card} title="Probability Assessment">
      ${pct(pStr)>0&&html`<${ProbBar} label="Primary Scenario" p=${pct(pStr)} dir=${pStr.match(/(BULLISH|BEARISH)/)?.[1]} />`}
      ${pct(sStr)>0&&html`<${ProbBar} label="Secondary Scenario" p=${pct(sStr)} dir=${sStr.match(/(BULLISH|BEARISH)/)?.[1]} />`}
      <${Row} label="Key Invalidation Level" value=${gf(prob,'Key Invalidation Level')} vc=${C.bear} />
    <//>`}

    ${regime.length>0&&html`<${Card} title="Regime Assessment">
      <${Row} label="Current Regime" value=${gf(regime,'Current Regime')} />
      <${Row} label="Protected High" value=${gf(regime,'Protected High')} vc=${C.bull} />
      <${Row} label="Protected Low" value=${gf(regime,'Protected Low')} vc=${C.bear} />
      <${Row} label="Regime Status" value=${gf(regime,'Regime Status')} />
      <${Row} label="Regime Change Phase" value=${gf(regime,'Regime Change Phase')} />
    <//>`}

    ${struct.length>0&&html`<${Card} title="Market Structure" color=${C.indigo}>
      <${Row} label="Recent BOS / CHoCH" value=${gf(struct,'Recent BOS/CHoCH')} />
      <${Row} label="Structure Phase" value=${gf(struct,'Current Market Structure Phase')} />
      <${Row} label="Higher Lows Building" value=${gf(struct,'Higher Lows Building')} />
      <${Row} label="Lower Highs Building" value=${gf(struct,'Lower Highs Building')} />
    <//>`}

    ${liq.length>0&&html`<${Card} title="Liquidity Map" color=${C.bull}>
      <${Row} label="Buy-Side Liquidity Above" value=${gf(liq,'Buy-Side Liquidity Above')} vc=${C.bull} />
      <${Row} label="Sell-Side Liquidity Below" value=${gf(liq,'Sell-Side Liquidity Below')} vc=${C.bear} />
      <${Row} label="PRIMARY Draw on Liquidity" value=${gf(liq,'PRIMARY Draw on Liquidity')} vc=${C.gold} />
      <${Row} label="Liquidity Sweeps" value=${gf(liq,'Liquidity Sweeps Identified')} />
    <//>`}

    ${pda.length>0&&html`<${Card} title="Key PD Arrays">
      <${Row} label="Bullish OBs" value=${gf(pda,'Bullish OBs')} vc=${C.bull} />
      <${Row} label="Bearish OBs" value=${gf(pda,'Bearish OBs')} vc=${C.bear} />
      <${Row} label="Bullish FVGs" value=${gf(pda,'Bullish FVGs')} vc=${C.bull} />
      <${Row} label="Bearish FVGs" value=${gf(pda,'Bearish FVGs')} vc=${C.bear} />
      <${Row} label="Breaker Blocks" value=${gf(pda,'Breaker Blocks')} />
      <${Row} label="Price vs Equilibrium" value=${gf(pda,'Current Price vs Equilibrium')} vc=${C.gold} />
    <//>`}

    ${t1.length>0&&html`<${TradeCard} title="Trade Idea 1 — Primary" lines=${t1} primary=${true} />`}
    ${t2.length>0&&html`<${TradeCard} title="Trade Idea 2 — Alternative" lines=${t2} primary=${false} />`}

    ${lvl.length>0&&html`<${Card} title="Key Levels to Watch">
      <${Row} label="Critical Demand Zone" value=${gf(lvl,'Critical Support')} vc=${C.bull} />
      <${Row} label="Critical Supply Zone" value=${gf(lvl,'Critical Resistance')} vc=${C.bear} />
      <${Row} label="Full Invalidation" value=${gf(lvl,'Invalidation Level')} vc=${C.bear} />
    <//>`}

    ${narr.length>0&&html`<div style=${{background:C.surface,border:`1px solid ${C.gold}40`,borderRadius:12,overflow:'hidden'}}>
      <div style=${{padding:'9px 15px',borderBottom:`1px solid ${C.gold}25`,background:C.gold+'08'}}>
        <span style=${{color:C.gold,fontWeight:700,fontSize:12,textTransform:'uppercase',letterSpacing:'0.07em'}}>Market Narrative</span>
      </div>
      <div style=${{padding:'16px 18px'}}>
        <p style=${{margin:0,color:C.text,fontSize:13,lineHeight:1.7,fontStyle:'italic',borderLeft:`4px solid ${C.gold}`,paddingLeft:13}}>
          ${narr.join(' ')}
        </p>
      </div>
    </div>`}

    ${Object.keys(sec).length===0&&html`<${Card} title="Raw Output" color=${C.subtle}>
      <pre style=${{margin:0,fontSize:11,color:C.text,lineHeight:1.6}}>${raw}</pre>
    <//>`}
  </div>`;
}

/* ── Trade Journal ───────────────────────────────────────────────── */
function Journal({entries,onDelete,onView}){
  if(!entries.length) return html`<div style=${{textAlign:'center',padding:'60px 20px'}}>
    <div style=${{fontSize:38,marginBottom:10}}>📋</div>
    <div style=${{color:C.subtle,fontSize:14}}>No analyses saved yet</div>
    <div style=${{color:C.border,fontSize:12,marginTop:5}}>Analyse a chart and tap "Save to Journal"</div>
  </div>`;

  return html`<div>${entries.map((e,i)=>{
    const dCol=e.direction?.includes('BULL')?C.bull:e.direction?.includes('BEAR')?C.bear:C.subtle;
    return html`<div key=${i} style=${{display:'flex',gap:10,background:C.surface,border:`1px solid ${C.border}`,borderRadius:12,padding:13,alignItems:'flex-start',marginBottom:9}}>
      ${e.preview&&html`<img src=${e.preview} alt="chart" style=${{width:72,height:52,objectFit:'cover',borderRadius:6,border:`1px solid ${C.border}`,flexShrink:0}} />`}
      <div style=${{flex:1,minWidth:0}}>
        <div style=${{fontSize:10,color:C.subtle,marginBottom:4}}>${new Date(e.ts).toLocaleString()}</div>
        <div style=${{fontSize:12,fontWeight:600,color:C.text,marginBottom:3}}>
          Primary: <span style=${{color:C.gold}}>${e.pp}%</span>
          ${e.direction&&html` <span style=${{color:dCol}}>${e.direction}</span>`}
        </div>
        ${e.narrative&&html`<p class="clamp2" style=${{margin:0,fontSize:11,color:C.subtle,lineHeight:1.4}}>${e.narrative}</p>`}
      </div>
      <div style=${{display:'flex',flexDirection:'column',gap:5,flexShrink:0}}>
        <button onClick=${()=>onView(e)} style=${{fontSize:11,color:C.gold,background:'none',border:`1px solid ${C.gold}40`,borderRadius:5,padding:'3px 9px',cursor:'pointer'}}>View</button>
        <button onClick=${()=>onDelete(i)} style=${{fontSize:11,color:C.subtle,background:'none',border:`1px solid ${C.border}`,borderRadius:5,padding:'3px 9px',cursor:'pointer'}}>Del</button>
      </div>
    </div>`;
  })}</div>`;
}

/* ── Main App ────────────────────────────────────────────────────── */
function App(){
  const [key,setKey]=useState('');
  const [showK,setShowK]=useState(false);
  const [proxyUrl,setProxyUrl]=useState('');
  const [showProxy,setShowProxy]=useState(false);
  const [img,setImg]=useState(null);
  const [analysis,setAnalysis]=useState(null);
  const [loading,setLoading]=useState(false);
  const [error,setError]=useState(null);
  const [journal,setJournal]=useState([]);
  const [tab,setTab]=useState('analysis');
  const [viewEntry,setViewEntry]=useState(null);

  const handleImg=useCallback(d=>{setImg(d);setAnalysis(null);setError(null);setViewEntry(null);},[]);

  const analyse=async()=>{
    if(!key.trim()){setError('Please enter your Anthropic API key.');return;}
    if(!img){setError('Please upload a chart image first.');return;}
    setLoading(true);setError(null);
    const useProxy=proxyUrl.trim().length>0;
    const endpoint=useProxy?proxyUrl.trim():'https://api.anthropic.com/v1/messages';
    const headers={'Content-Type':'application/json','x-api-key':key.trim(),'anthropic-version':'2023-06-01'};
    if(!useProxy) headers['anthropic-dangerous-allow-browser']='true';
    try{
      let res;
      try{
        res=await fetch(endpoint,{
          method:'POST',
          mode:'cors',
          headers,
          body:JSON.stringify({
            model:'claude-sonnet-4-6',max_tokens:4000,temperature:0,system:SYSTEM_PROMPT,
            messages:[{role:'user',content:[
              {type:'image',source:{type:'base64',media_type:img.mediaType,data:img.base64}},
              {type:'text',text:'Analyse this chart screenshot using the complete SMC/ICT framework. Produce the full structured analysis in the exact format specified. Be precise, specific, and use ICT terminology exclusively.'}
            ]}]
          })
        });
      }catch(netErr){
        throw new Error((useProxy?'Proxy request failed — check the proxy URL is correct. ':'Network request failed — check your internet connection and that the API key is correct. ')+'('+netErr.message+')');
      }
      if(!res.ok){
        const e=await res.json().catch(()=>({}));
        const msg=e.error?.message||'';
        if(res.status===401) throw new Error('Invalid API key — please check and re-enter your Anthropic API key.');
        if(res.status===429) throw new Error('Rate limit reached — please wait a moment and try again.');
        if(res.status===413) throw new Error('Image too large for API — try a smaller screenshot.');
        throw new Error(msg||`API error ${res.status}`);
      }
      const data=await res.json();
      const text=data.content?.[0]?.text;
      if(!text) throw new Error('No content returned from API.');
      setAnalysis(text);
    }catch(e){setError(e.message||'Unexpected error — please try again.');}
    finally{setLoading(false);}
  };

  const saveToJournal=()=>{
    if(!analysis) return;
    const sec=parseAnalysis(analysis);
    const regime=sec['REGIME ASSESSMENT']||[];
    const prob=sec['PROBABILITY ASSESSMENT']||[];
    const narr=sec['MARKET NARRATIVE']||[];
    const pStr=gf(prob,'Primary Scenario Probability')||'';
    setJournal(prev=>[{
      ts:Date.now(),preview:img?.preview,
      regime:gf(regime,'Current Regime'),
      pp:pct(pStr),direction:pStr.match(/(BULLISH|BEARISH)/)?.[1],
      narrative:narr.join(' ').slice(0,250),rawAnalysis:analysis,
    },...prev]);
    setTab('journal');
  };

  const reset=()=>{setImg(null);setAnalysis(null);setError(null);setViewEntry(null);};

  const TABS=[
    {id:'analysis',label:'Chart Analysis'},
    {id:'journal',label:`Journal (${journal.length})`},
    {id:'calculator',label:'Calculator'},
    {id:'clock',label:'Session Clock'},
  ];

  const iStyle={background:C.bg,border:`1px solid ${C.border}`,color:C.text,borderRadius:8,padding:'8px 36px 8px 11px',width:'100%',fontSize:13};
  const btnStyle=(active)=>({padding:'10px 16px',fontSize:13,fontWeight:600,background:'none',border:'none',
    borderBottom:`2px solid ${active?C.gold:'transparent'}`,color:active?C.gold:C.subtle,cursor:'pointer',marginBottom:-1,transition:'color .15s'});

  return html`<div style=${{minHeight:'100vh',background:C.bg}}>
    <!-- Header -->
    <div style=${{borderBottom:`1px solid ${C.border}`,background:C.surface,position:'sticky',top:0,zIndex:10}}>
      <div style=${{maxWidth:1100,margin:'0 auto',padding:'0 16px',display:'flex',alignItems:'center',justifyContent:'space-between',height:54}}>
        <div>
          <div style=${{fontSize:16,fontWeight:800,color:C.gold}}>⚡ SMC/ICT Chart Analysis Agent</div>
          <div style=${{fontSize:10,color:C.subtle,marginTop:1}}>Smart Money Concepts · Inner Circle Trader · Institutional Analysis</div>
        </div>
        <div style=${{textAlign:'right'}}>
          <div style=${{fontSize:9,color:C.subtle}}>Powered by</div>
          <div style=${{fontSize:11,fontWeight:700,color:C.gold}}>claude-sonnet-4-6</div>
        </div>
      </div>
    </div>

    <div style=${{maxWidth:1100,margin:'0 auto',padding:'20px 16px'}}>
      <!-- API Key -->
      <div style=${{background:C.surface,border:`1px solid ${C.border}`,borderRadius:12,padding:'13px 15px',marginBottom:18}}>
        <div style=${{fontSize:10,color:C.subtle,fontWeight:700,letterSpacing:'0.07em',marginBottom:5}}>ANTHROPIC API KEY</div>
        <div style=${{position:'relative'}}>
          <input type=${showK?'text':'password'} value=${key} onInput=${e=>setKey(e.target.value)}
            placeholder="sk-ant-api03-..." style=${iStyle} />
          <button onClick=${()=>setShowK(v=>!v)} style=${{position:'absolute',right:10,top:'50%',transform:'translateY(-50%)',background:'none',border:'none',cursor:'pointer',fontSize:14,padding:0}}>
            ${showK?'🙈':'👁️'}
          </button>
        </div>
        <div style=${{fontSize:11,color:C.subtle,marginTop:5}}>Key stays in browser memory only — never stored or sent anywhere except api.anthropic.com</div>
        <div style=${{marginTop:8}}>
          <button onClick=${()=>setShowProxy(v=>!v)} style=${{fontSize:11,color:C.subtle,background:'none',border:'none',cursor:'pointer',padding:0,textDecoration:'underline'}}>
            ${showProxy?'▲ Hide proxy settings (iOS fix)':'▼ iOS Safari getting "Load failed"? Set up a proxy'}
          </button>
          ${showProxy&&html`<div style=${{marginTop:8,padding:'11px 13px',borderRadius:9,background:C.bg,border:`1px solid ${C.border}`}}>
            <div style=${{fontSize:11,fontWeight:700,color:C.gold,marginBottom:5}}>CLOUDFLARE WORKER PROXY URL (iOS Fix)</div>
            <div style=${{fontSize:11,color:C.subtle,marginBottom:8,lineHeight:1.5}}>
              iOS Safari blocks direct calls to api.anthropic.com due to CORS restrictions.
              Deploy the free Cloudflare Worker in <b style=${{color:C.text}}>cloudflare-proxy/worker.js</b> (in the repo),
              then paste your Worker URL here. The proxy forwards your request server-side — no CORS issues.
            </div>
            <input
              type="url"
              value=${proxyUrl}
              onInput=${e=>setProxyUrl(e.target.value)}
              placeholder="https://your-worker.your-subdomain.workers.dev"
              style=${{...iStyle,fontFamily:'monospace',fontSize:12}}
            />
            ${proxyUrl&&html`<div style=${{fontSize:11,color:C.bull,marginTop:5}}>✓ Proxy active — requests will be routed via your Worker</div>`}
          </div>`}
        </div>
      </div>

      <!-- Tabs -->
      <div style=${{display:'flex',borderBottom:`1px solid ${C.border}`,marginBottom:20,overflowX:'auto'}}>
        ${TABS.map(t=>html`<button key=${t.id} onClick=${()=>setTab(t.id)} style=${btnStyle(tab===t.id)}>${t.label}</button>`)}
      </div>

      <!-- Analysis Tab -->
      ${tab==='analysis'&&html`<div style=${{display:'grid',gridTemplateColumns:'minmax(0,1fr) minmax(0,1fr)',gap:20}}>
        <!-- Left -->
        <div>
          ${!img
            ? html`<${Uploader} onLoad=${handleImg} />`
            : viewEntry
            ? html`<div>
                <button onClick=${()=>setViewEntry(null)} style=${{fontSize:12,color:C.subtle,background:'none',border:'none',cursor:'pointer',marginBottom:10,padding:0}}>← Back</button>
                <img src=${viewEntry.preview} alt="saved" style=${{width:'100%',borderRadius:10,border:`1px solid ${C.border}`}} />
              </div>`
            : html`<div style=${{borderRadius:12,overflow:'hidden',border:`1px solid ${C.border}`}}>
                <img src=${img.preview} alt="Chart" style=${{width:'100%',maxHeight:300,objectFit:'contain',background:'#000',display:'block'}} />
                <div style=${{padding:'11px 13px',background:C.surface,display:'flex',gap:8}}>
                  <button onClick=${analyse} disabled=${loading} style=${{flex:1,padding:'10px',borderRadius:8,border:'none',cursor:loading?'not-allowed':'pointer',background:loading?C.border:C.gold,color:loading?C.subtle:C.bg,fontWeight:700,fontSize:13}}>
                    ${loading
                      ? html`<span style=${{display:'flex',alignItems:'center',justifyContent:'center',gap:7}}>
                          <svg class="spin" width="14" height="14" viewBox="0 0 24 24" fill="none">
                            <circle opacity=".25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/>
                            <path opacity=".75" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z" fill="currentColor"/>
                          </svg>
                          Analysing...
                        </span>`
                      : 'Analyse Chart'}
                  </button>
                  <button onClick=${reset} style=${{padding:'10px 14px',borderRadius:8,border:`1px solid ${C.border}`,background:'transparent',color:C.subtle,fontSize:13,cursor:'pointer'}}>Reset</button>
                </div>
              </div>`}

          ${error&&html`<div style=${{marginTop:10,padding:'11px 13px',borderRadius:10,border:`1px solid ${C.bear}50`,background:C.bear+'12'}}>
            <div style=${{fontWeight:700,fontSize:12,color:C.bear,marginBottom:2}}>Error</div>
            <div style=${{fontSize:12,color:C.text}}>${error}</div>
          </div>`}

          ${analysis&&!viewEntry&&html`<button onClick=${saveToJournal} style=${{marginTop:9,width:'100%',padding:'10px',borderRadius:8,border:`1px solid ${C.border}`,background:'transparent',color:C.gold,fontSize:13,fontWeight:600,cursor:'pointer'}}>
            📋 Save to Journal
          </button>`}

          ${!img&&html`<div style=${{marginTop:12,background:C.surface,border:`1px solid ${C.border}`,borderRadius:12,padding:'13px 15px'}}>
            <div style=${{fontSize:11,fontWeight:700,color:C.gold,marginBottom:8,letterSpacing:'0.06em'}}>HOW TO USE</div>
            ${['① Enter your Anthropic API key above',
               '② Upload a TradingView, MT4/5 or cTrader screenshot',
               '③ Tap "Analyse Chart" — takes 10–20 seconds',
               '④ Review probability scores, PD arrays and trade ideas',
               '⑤ Save to Journal to track analyses over time',
               '⑥ Calculator tab → position sizing',
               '⑦ Session Clock tab → active kill zones',
               '📱 iOS Safari users: expand "iOS Safari getting Load failed?" below the API key field',
              ].map(s=>html`<div key=${s} style=${{fontSize:12,color:C.subtle,marginBottom:4}}>${s}</div>`)}
          </div>`}
        </div>

        <!-- Right -->
        <div>
          ${viewEntry
            ? html`<${AnalysisDisplay} raw=${viewEntry.rawAnalysis} />`
            : analysis
            ? html`<${AnalysisDisplay} raw=${analysis} />`
            : html`<div style=${{display:'flex',alignItems:'center',justifyContent:'center',minHeight:380,border:`1px dashed ${C.border}`,borderRadius:12}}>
                <div style=${{textAlign:'center'}}>
                  <div style=${{fontSize:38,marginBottom:10}}>🔍</div>
                  <div style=${{color:C.subtle,fontSize:14}}>Analysis will appear here</div>
                  <div style=${{color:C.border,fontSize:12,marginTop:5}}>Upload a chart and tap Analyse Chart</div>
                </div>
              </div>`}
        </div>
      </div>`}

      ${tab==='journal'&&html`<${Journal}
        entries=${journal}
        onDelete=${i=>setJournal(prev=>prev.filter((_,idx)=>idx!==i))}
        onView=${e=>{setViewEntry(e);setTab('analysis');}}
      />`}

      ${tab==='calculator'&&html`<div style=${{maxWidth:520}}><${Calculator} /></div>`}
      ${tab==='clock'&&html`<div style=${{maxWidth:460}}><${SessionClock} /></div>`}
    </div>

    <!-- Footer -->
