name: Record GexBot snapshots

# Captures GexBot gamma levels into Firestore during the US cash session.
#
# Why this exists: the GexBot Classic API serves only a *live* snapshot. There
# is no history endpoint on our tier (history paths 404; /negotiate returns 403,
# so those endpoints exist but are gated to Quant). Anything not recorded as it
# happens is unrecoverable, so this runs to build the dataset that settles the
# volume-vs-open-interest question -- see
# Gex-Bot/youtube-research/analysis/strategy-synthesis.md §5.
#
# Why Firestore and not a commit: this repository is PUBLIC and GexBot Classic
# is a paid subscription, so committing a continuous machine-readable feed of
# its computed levels would republish a paid data product. Firestore keeps it
# private behind the same rules the trade journal uses, and as a bonus writes
# nothing to the repo -- so this never triggers deploy-dashboard.yml and adds no
# commit noise.

on:
  schedule:
    # Every 5 minutes through the US cash session, Mon-Fri.
    # The session is 13:30-20:00 UTC on EDT and 14:30-21:00 UTC on EST, so the
    # 13:00-21:59 span covers both without a DST-dependent schedule. Samples
    # outside the session are cheap and harmless -- the feed simply repeats its
    # last timestamp, which the recorder dedupes.
    - cron: '*/5 13-21 * * 1-5'
  workflow_dispatch:        # manual run, for testing the wiring

# A delayed run must never overlap the next scheduled one. Queued runs are
# dropped rather than piling up: a late sample is worth less than a clean feed,
# and the next tick is only 5 minutes away.
concurrency:
  group: gexbot-record
  cancel-in-progress: false

permissions:
  contents: read            # nothing is written back to the repo

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 5      # a hung fetch should die, not burn the runner
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1    # shallow: this job only needs the scripts

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        # google-auth only, to exchange the service account for an OAuth token.
        # Everything else in Gex-Bot is stdlib.
        run: pip install --quiet google-auth

      - name: Record snapshot
        env:
          GEX_BOT_API_TOKEN: ${{ secrets.GEX_BOT_API_TOKEN }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          python3 Gex-Bot/scripts/record_snapshot.py \
            --tickers spx nq_ndx es_spx ndx \
            --scopes zero \
            --firestore \
            --no-local
