name: Pravzella Trade Sync

on:
  schedule:
    # Every 30 min, 06:00-20:00 GMT Mon-Fri — same trading-hours window as the macro
    # data fetch. Always re-scans a rolling lookback (see scripts/sync-trades.ts) and
    # upserts idempotently, so missed/overlapping runs are harmless.
    - cron: '0,30 6-20 * * 1-5'
  workflow_dispatch:   # Triggerable manually from GitHub UI (e.g. for the first backfill)

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: xauusd-dashboard/package-lock.json

      - name: Install dependencies
        run: cd xauusd-dashboard && npm ci

      - name: Sync trades from cTrader to Supabase
        run: cd xauusd-dashboard && npx tsx scripts/sync-trades.ts
        env:
          CTRADER_MCP_URL:          ${{ secrets.VITE_CTRADER_MCP_URL }}
          CTRADER_MCP_TOKEN:        ${{ secrets.VITE_CTRADER_MCP_TOKEN }}
          SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_USER_ID:          ${{ secrets.SUPABASE_USER_ID }}
