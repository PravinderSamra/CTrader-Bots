name: XAUUSD Data Fetch

on:
  schedule:
    # Hourly at the top of the hour, 06:00-20:00 GMT, Mon-Fri — covers London open
    # through NY close so same-day/recent-hours catalysts (rumors, surprise data
    # prints, etc.) and the week-ahead economic calendar stay current intraday,
    # not just once per day. Produces ~14 commits/day to the snapshot file.
    - cron: '0 6-20 * * 1-5'
    # B4 (UK100-V2-PLAN.md §4): extra UK100 ORB-window run at 08:20 London,
    # 5 minutes after the 08:00-08:15 opening-range bars close, so
    # orbBrokenDirection/orbContext are fresh right when the ORB playbook
    # needs them rather than waiting for the next top-of-hour tick. Two UTC
    # entries cover both DST states — 07:20Z = 08:20 London in BST (summer),
    # 08:20Z = 08:20 London in GMT (winter); the off-season sibling run is
    # harmless (one extra refresh, ~30-60 min from the real 08:20 local).
    - cron: '20 7,8 * * 1-5'
  workflow_dispatch:           # Triggerable manually from GitHub UI

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: gex-agent-deploy
  cancel-in-progress: false

jobs:
  fetch-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: xauusd-dashboard/package-lock.json

      - name: Install dependencies
        run: cd xauusd-dashboard && npm ci

      - name: Fetch daily data snapshot
        run: cd xauusd-dashboard && npx tsx scripts/fetch-static-data.ts
        env:
          FRED_API_KEY:             ${{ secrets.FRED_API_KEY }}
          CTRADER_MCP_URL:          ${{ secrets.VITE_CTRADER_MCP_URL }}
          CTRADER_MCP_TOKEN:        ${{ secrets.VITE_CTRADER_MCP_TOKEN }}
          ALPHA_VANTAGE_API_KEY:    ${{ secrets.ALPHA_VANTAGE_API_KEY }}
          FINNHUB_API_KEY:          ${{ secrets.FINNHUB_API_KEY }}
          ANTHROPIC_API_KEY:        ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Fetch UK100 data snapshot
        # Phase 2a of UK100-BUILD-PLAN.md. continue-on-error: a UK100 fetch
        # failure must never block the gold snapshot/deploy — same reasoning
        # as the resolver step below.
        continue-on-error: true
        run: cd xauusd-dashboard && npx tsx scripts/fetch-uk100-data.ts
        env:
          FRED_API_KEY:             ${{ secrets.FRED_API_KEY }}
          CTRADER_MCP_URL:          ${{ secrets.VITE_CTRADER_MCP_URL }}
          CTRADER_MCP_TOKEN:        ${{ secrets.VITE_CTRADER_MCP_TOKEN }}
          FINNHUB_API_KEY:          ${{ secrets.FINNHUB_API_KEY }}
          ANTHROPIC_API_KEY:        ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Resolve gold-session outcomes
        # Scores past /gold-session predictions against realised XAUUSD H1 price and
        # writes outcomes back into the session files + outcomes.json (the calibration
        # archive). No-op when the cTrader token is unset. Never fails the run.
        continue-on-error: true
        run: cd xauusd-dashboard && npx tsx scripts/resolve-gold-sessions.ts
        env:
          CTRADER_MCP_URL:          ${{ secrets.VITE_CTRADER_MCP_URL }}
          CTRADER_MCP_TOKEN:        ${{ secrets.VITE_CTRADER_MCP_TOKEN }}

      - name: Resolve uk100-session outcomes
        # F7 (UK100-SESSION-REVIEW-2026-07-13.md §5 / UK100-V2-PLAN.md Phase C2):
        # same as the gold resolver above, scored against realised UK100 H1 price
        # into public/data/uk100/sessions/outcomes.json. No-op when the cTrader
        # token is unset. Never fails the run.
        continue-on-error: true
        run: cd xauusd-dashboard && npx tsx scripts/resolve-uk100-sessions.ts
        env:
          CTRADER_MCP_URL:          ${{ secrets.VITE_CTRADER_MCP_URL }}
          CTRADER_MCP_TOKEN:        ${{ secrets.VITE_CTRADER_MCP_TOKEN }}

      - name: Commit updated snapshot
        run: |
          git config user.name  "xauusd-data-bot"
          git config user.email "xauusd-data-bot@noreply.github.com"
          # Stage the WHOLE data dir — the fetch/resolve scripts also write
          # history.json and outcomes.json. Staging only snapshot+sessions left
          # history.json unstaged, which made `git pull --rebase` abort with
          # "cannot pull with rebase: You have unstaged changes" and silently
          # skipped every deploy (observed 2026-07-07). --autostash is a belt-
          # and-braces guard against any other stray working-tree change.
          git add xauusd-dashboard/public/data/
          if ! git diff --staged --quiet; then
            git commit -m "chore: XAUUSD data snapshot $(date -u +%Y-%m-%dT%H:%M)Z"
            git pull --rebase --autostash origin main
            git push origin main
          else
            echo "No data changes to commit"
          fi

      - name: Build XAUUSD dashboard
        # No third-party API secrets here by design — see comment in
        # deploy-dashboard.yml's build step. VITE_FIREBASE_* is the one exception,
        # explained there too (Firebase's client config is meant to be public).
        run: cd xauusd-dashboard && npm run build
        env:
          VITE_FIREBASE_API_KEY:      ${{ secrets.FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN:  ${{ secrets.FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID:   ${{ secrets.FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_APP_ID:       ${{ secrets.FIREBASE_APP_ID }}

      - name: Build full site structure
        run: |
          mkdir -p _site/gex-oi
          mkdir -p _site/chart-analysis
          mkdir -p _site/xauusd-dashboard

          cp -r "GEX&OI/dashboard/." _site/gex-oi/
          cp "Chart-Analysis-Agent/index.html" _site/chart-analysis/index.html
          cp -r xauusd-dashboard/dist/. _site/xauusd-dashboard/

          cat > _site/index.html << 'EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>CTrader Bots — Dashboards</title>
            <style>
              * { box-sizing: border-box; margin: 0; padding: 0; }
              body {
                font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
                background: #0a0e17; color: #e8ecf4;
                min-height: 100vh;
                display: flex; flex-direction: column;
                align-items: center; justify-content: center;
                padding: 40px 20px;
              }
              .logo { font-size: 13px; font-weight: 700; letter-spacing: 1.5px;
                      text-transform: uppercase; color: #38bdf8; margin-bottom: 8px; }
              h1 { font-size: 28px; font-weight: 800; letter-spacing: -0.5px; margin-bottom: 6px; }
              .sub { font-size: 13px; color: #8896b0; margin-bottom: 48px; }
              .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
                      gap: 16px; width: 100%; max-width: 1000px; }
              a.card {
                background: #151d2e; border: 1px solid #1e2d45; border-radius: 10px;
                padding: 24px; text-decoration: none; color: inherit;
                transition: border-color 0.18s, transform 0.18s;
                display: flex; flex-direction: column; gap: 8px;
              }
              a.card:hover { border-color: #38bdf8; transform: translateY(-2px); }
              a.card.gold:hover  { border-color: #F0B429; }
              a.card.xauusd:hover { border-color: #C9952A; }
              .card-icon { font-size: 28px; }
              .card-title { font-size: 15px; font-weight: 700; color: #e8ecf4; }
              .card-desc { font-size: 12px; color: #8896b0; line-height: 1.5; }
              .card-tag { font-size: 10px; font-weight: 700; letter-spacing: 0.6px;
                          padding: 3px 8px; border-radius: 4px; width: fit-content;
                          text-transform: uppercase; }
              .tag-blue  { background: rgba(56,189,248,0.12);  color: #38bdf8; }
              .tag-gold  { background: rgba(240,180,41,0.15);  color: #F0B429; }
              .tag-xauusd { background: rgba(201,149,42,0.15); color: #C9952A; }
            </style>
          </head>
          <body>
            <div class="logo">CTrader Bots</div>
            <h1>Trading Dashboards</h1>
            <p class="sub">Select a dashboard below</p>
            <div class="grid">
              <a class="card xauusd" href="xauusd-dashboard/">
                <div class="card-icon">Au</div>
                <div class="card-title">XAUUSD Intelligence Dashboard</div>
                <div class="card-desc">Daily gold trading analyst — macro data tiles, AI briefing, and directional bias gauge</div>
                <div class="card-tag tag-xauusd">AI · Gold</div>
              </a>
              <a class="card" href="gex-oi/">
                <div class="card-icon">&#x1F4CA;</div>
                <div class="card-title">GEX &amp; OI Dashboard</div>
                <div class="card-desc">Gamma Exposure &amp; Open Interest analysis for US500, XAUUSD, GER40, UK100</div>
                <div class="card-tag tag-blue">Live</div>
              </a>
              <a class="card gold" href="chart-analysis/">
                <div class="card-icon">&#x26A1;</div>
                <div class="card-title">SMC/ICT Chart Analysis Agent</div>
                <div class="card-desc">Upload a chart screenshot for full institutional-grade ICT/SMC analysis with probability scores and trade ideas</div>
                <div class="card-tag tag-gold">AI Agent</div>
              </a>
            </div>
          </body>
          </html>
          EOF

      - name: Setup Pages
        uses: actions/configure-pages@1f0c5cde4bc74cd7e1254d0cb4de8d49e9068c7d # v4.0.0

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: "_site"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
