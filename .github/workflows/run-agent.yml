name: Run GEX & OI Agent

on:
  schedule:
    - cron: '0 6 * * 1-5'    # 06:00 UTC = 07:00 BST (pre-London)  Mon–Fri
    - cron: '30 13 * * 1-5'  # 13:30 UTC = 14:30 BST (NY open)    Mon–Fri
  workflow_dispatch:
    inputs:
      instruments:
        description: 'Which instruments to scan'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - 'US500 XAUUSD'
          - 'UK100 GER40'
          - US500
          - XAUUSD
          - UK100
          - GER40

permissions:
  contents: write

concurrency:
  group: gex-agent-deploy
  cancel-in-progress: false

jobs:
  run-agent-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python dependencies
        run: pip install yfinance scipy pandas numpy matplotlib

      - name: Run GEX & OI Agent
        env:
          MPLBACKEND: Agg
          CTRADER_MCP_TOKEN: ${{ secrets.CTRADER_MCP_TOKEN }}
        run: |
          cd "GEX&OI/agent_skill"
          INSTRUMENTS="${{ github.event.inputs.instruments }}"

          if [ -z "$INSTRUMENTS" ] || [ "$INSTRUMENTS" = "all" ]; then
            echo "Running full scan for all instruments..."
            python gex_oi_agent.py --all --output both
          else
            echo "Running scan for: $INSTRUMENTS"
            FLAGS=""
            for inst in $INSTRUMENTS; do
              FLAGS="$FLAGS --instrument $inst"
            done
            python gex_oi_agent.py $FLAGS --output both
          fi

      - name: Commit updated data files to repository
        # NOTE: no Pages-deploy step here by design. This push (path
        # `GEX&OI/dashboard/data/**`) is inside deploy-dashboard.yml's trigger
        # paths, so it fires that workflow automatically, which builds the
        # COMPLETE site (gex-oi + chart-analysis + xauusd-dashboard). This job
        # used to build and deploy its own `_site` containing only gex-oi and
        # chart-analysis — every run silently wiped xauusd-dashboard off
        # GitHub Pages (observed 2026-07-10: the 09:28 UTC cron overwrote a
        # good deploy from 07:33 UTC and took the whole dashboard down).
        run: |
          git config user.name "GEX Agent Bot"
          git config user.email "gex-agent@noreply.github.com"
          git add "GEX&OI/dashboard/data/"
          if ! git diff --staged --quiet; then
            git commit -m "Auto-scan: GEX & OI data [$(date -u '+%Y-%m-%d %H:%M UTC')]"
            git pull --rebase origin main
            git push origin main
          else
            echo "No data changes to commit."
          fi
