name: Archive GexBot session

# Downloads the completed session's EOD report and stores the derived research
# data in Firestore.
#
# Why this runs daily and cannot be caught up later: /hist/eod/{TICKER} serves
# only the most recent completed session. Its `date` parameter is accepted but
# IGNORED — every date returns the same file, confirmed by reading the
# content-disposition filename. The dated archive that would allow backfill,
# /v2/hist/{TICKER}/{PACKAGE}/{CATEGORY}/{DATE}, returns 403 on the Classic
# package. So a session missed here is a session lost, exactly like the live
# feed. See Gex-Bot/research/volume-vs-open-interest.md.
#
# The ~20 MB raw report is deliberately not retained. This repository is
# public and the report is paid vendor data; the job derives the session's
# statistics plus a downsampled spot-and-walls series (~330 KB) and stores
# only that, privately.

on:
  schedule:
    # 23:30 UTC weekdays. The binding constraint is not the cash close but the
    # vendor's cold-storage export: their docs state today's report only
    # appears after 17:00 ET, and before then the endpoint returns the PRIOR
    # session with a 200 and no error. 23:30 UTC is 19:30 ET on EDT and 18:30
    # ET on EST — a comfortable margin either side of the switch. An earlier
    # 22:30 UTC left only 30 minutes under EST.
    - cron: '30 23 * * 1-5'
  workflow_dispatch:

concurrency:
  group: gexbot-eod
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 15      # a ~20 MB download plus parsing
    strategy:
      fail-fast: false       # one ticker failing must not lose the others
      matrix:
        ticker: [nq_ndx, spx]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install --quiet google-auth requests

      - name: Archive session
        env:
          GEX_BOT_API_TOKEN: ${{ secrets.GEX_BOT_API_TOKEN }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          # At 23:30 UTC the ET date is still the same calendar day, so the
          # session we expect is simply today. Failing loudly on a mismatch
          # matters because a missed session cannot be fetched later.
          python3 Gex-Bot/scripts/archive_eod.py \
            --ticker ${{ matrix.ticker }} \
            --scope gex_zero \
            --expect-date "$(date -u +%F)" \
            --fail-if-stale \
            --firestore
