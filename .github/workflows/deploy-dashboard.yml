name: Deploy Dashboards to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "GEX&OI/dashboard/**"
      - "Chart-Analysis-Agent/**"
      - "xauusd-dashboard/src/**"
      - "xauusd-dashboard/public/**"
      - "xauusd-dashboard/index.html"
      - "xauusd-dashboard/vite.config.ts"
      - ".github/workflows/deploy-dashboard.yml"
  workflow_dispatch:  # Allow manual trigger from GitHub UI

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: xauusd-dashboard/package-lock.json

      - name: Install XAUUSD dashboard dependencies
        run: cd xauusd-dashboard && npm ci

      - name: Build XAUUSD dashboard
        # No third-party API secrets here by design: prices/calendar/headlines/briefing
        # all come from the pre-built, secret-free public/data/daily-snapshot.json
        # committed by the daily-fetch workflow — see xauusd-daily-fetch.yml for where
        # those real (server-side) API calls happen.
        #
        # VITE_FIREBASE_* are the one exception: this is just Firebase's public client
        # config (identifies which project to talk to) — it grants nothing by itself.
        # Access control is Firestore Security Rules + a real login, see
        # xauusd-dashboard/PRAVZELLA.md "Auth model" — unlike the bearer tokens
        # described above, it's safe to inline into this public bundle.
        run: cd xauusd-dashboard && npm run build
        env:
          VITE_FIREBASE_API_KEY:      ${{ secrets.FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN:  ${{ secrets.FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID:   ${{ secrets.FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_APP_ID:       ${{ secrets.FIREBASE_APP_ID }}

      - name: Build site structure
        run: |
          mkdir -p _site/gex-oi
          mkdir -p _site/chart-analysis
          mkdir -p _site/xauusd-dashboard

          # Copy GEX & OI dashboard into its subfolder
          cp -r "GEX&OI/dashboard/." _site/gex-oi/

          # Copy Chart Analysis Agent into its subfolder
          cp "Chart-Analysis-Agent/index.html" _site/chart-analysis/index.html

          # Copy built XAUUSD dashboard
          cp -r xauusd-dashboard/dist/. _site/xauusd-dashboard/

          # Root index — links to all dashboards
          cat > _site/index.html << 'EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>CTrader Bots — Dashboards</title>
            <style>
              * { box-sizing: border-box; margin: 0; padding: 0; }
              body {
                font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
                background: #0a0e17; color: #e8ecf4;
                min-height: 100vh;
                display: flex; flex-direction: column;
                align-items: center; justify-content: center;
                padding: 40px 20px;
              }
              .logo { font-size: 13px; font-weight: 700; letter-spacing: 1.5px;
                      text-transform: uppercase; color: #38bdf8; margin-bottom: 8px; }
              h1 { font-size: 28px; font-weight: 800; letter-spacing: -0.5px; margin-bottom: 6px; }
              .sub { font-size: 13px; color: #8896b0; margin-bottom: 48px; }
              .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
                      gap: 16px; width: 100%; max-width: 1000px; }
              a.card {
                background: #151d2e; border: 1px solid #1e2d45; border-radius: 10px;
                padding: 24px; text-decoration: none; color: inherit;
                transition: border-color 0.18s, transform 0.18s;
                display: flex; flex-direction: column; gap: 8px;
              }
              a.card:hover { border-color: #38bdf8; transform: translateY(-2px); }
              a.card.gold:hover   { border-color: #F0B429; }
              a.card.xauusd:hover { border-color: #C9952A; }
              .card-icon { font-size: 28px; }
              .card-title { font-size: 15px; font-weight: 700; color: #e8ecf4; }
              .card-desc { font-size: 12px; color: #8896b0; line-height: 1.5; }
              .card-tag { font-size: 10px; font-weight: 700; letter-spacing: 0.6px;
                          padding: 3px 8px; border-radius: 4px; width: fit-content;
                          text-transform: uppercase; }
              .tag-blue   { background: rgba(56,189,248,0.12);  color: #38bdf8; }
              .tag-gold   { background: rgba(240,180,41,0.15);  color: #F0B429; }
              .tag-xauusd { background: rgba(201,149,42,0.15);  color: #C9952A; }
            </style>
          </head>
          <body>
            <div class="logo">CTrader Bots</div>
            <h1>Trading Dashboards</h1>
            <p class="sub">Select a dashboard below</p>
            <div class="grid">
              <a class="card xauusd" href="xauusd-dashboard/">
                <div class="card-icon">Au</div>
                <div class="card-title">XAUUSD Intelligence Dashboard</div>
                <div class="card-desc">Daily gold trading analyst — macro data tiles, AI briefing, and directional bias gauge</div>
                <div class="card-tag tag-xauusd">AI · Gold</div>
              </a>
              <a class="card" href="gex-oi/">
                <div class="card-icon">&#x1F4CA;</div>
                <div class="card-title">GEX &amp; OI Dashboard</div>
                <div class="card-desc">Gamma Exposure &amp; Open Interest analysis for US500, XAUUSD, GER40, UK100</div>
                <div class="card-tag tag-blue">Live</div>
              </a>
              <a class="card gold" href="chart-analysis/">
                <div class="card-icon">&#x26A1;</div>
                <div class="card-title">SMC/ICT Chart Analysis Agent</div>
                <div class="card-desc">Upload a chart screenshot for full institutional-grade ICT/SMC analysis with probability scores and trade ideas</div>
                <div class="card-tag tag-gold">AI Agent</div>
              </a>
            </div>
          </body>
          </html>
          EOF

      - name: Setup Pages
        uses: actions/configure-pages@1f0c5cde4bc74cd7e1254d0cb4de8d49e9068c7d # v4.0.0

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: "_site"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
