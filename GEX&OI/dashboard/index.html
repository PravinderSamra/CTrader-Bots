<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="GEX & OI Professional Trading Dashboard — Gamma Exposure and Open Interest analysis for US500, XAUUSD, GER40, UK100">
  <title>GEX &amp; OI Dashboard</title>

  <!-- Google Fonts — Inter + JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">

  <!-- Plotly.js — Interactive charting -->
  <script src="https://cdn.plot.ly/plotly-2.27.0.min.js" charset="utf-8"></script>

  <!-- Dashboard stylesheet -->
  <link rel="stylesheet" href="css/style.css">

  <!-- Instrument data files (auto-generated by gex_oi_agent.py) -->
  <script src="data/US500_latest.js"></script>
  <script src="data/XAUUSD_latest.js"></script>
  <script src="data/GER40_latest.js"></script>
  <script src="data/UK100_latest.js"></script>
</head>
<body>

  <!-- ============================================================
       TOP NAVIGATION BAR
       ============================================================ -->
  <header class="topbar" role="banner">

    <!-- Logo / Brand -->
    <div class="topbar-logo">
      <div class="logo-mark">GX</div>
      <div>
        <div class="logo-text">GEX &amp; OI</div>
        <div class="logo-sub">Trading Dashboard</div>
      </div>
    </div>

    <!-- Instrument Tabs -->
    <nav class="instrument-tabs" id="instrument-tabs" role="tablist" aria-label="Instrument selection">
      <!-- Populated by app.js -->
    </nav>

    <!-- Controls -->
    <div class="topbar-controls">
      <span class="scan-time" id="scan-time" title="Time of last scan"></span>
      <button class="btn-icon" id="theme-toggle" onclick="toggleTheme()" title="Toggle theme" aria-label="Toggle dark/light mode">☀️</button>
    </div>

  </header>

  <!-- ============================================================
       MAIN LAYOUT
       ============================================================ -->
  <div class="main-layout" role="main">

    <!-- Sidebar -->
    <nav class="sidebar" id="sidebar" role="navigation" aria-label="Section navigation">
      <!-- Populated by app.js -->
    </nav>

    <!-- Content Area -->
    <div class="content-area" id="content-area" role="region" aria-live="polite">
      <!-- Panels populated by app.js -->
      <div id="panel-charts"    class="panel active"></div>
      <div id="panel-metrics"   class="panel"></div>
      <div id="panel-oi"        class="panel"></div>
      <div id="panel-situation" class="panel"></div>
      <div id="panel-levels"    class="panel"></div>
      <div id="panel-scenarios" class="panel"></div>
    </div>

  </div>

  <!-- ============================================================
       APPLICATION SCRIPTS
       ============================================================ -->
  <script src="js/charts.js"></script>
  <script src="js/app.js"></script>

</body>
</html>
